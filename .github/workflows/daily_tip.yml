name: 🤖 AI Daily DevOps Tip

on:
  schedule:
    # Runs every day at 6:00 AM UTC (11:30 AM IST)
    - cron: "0 6 * * *"
  workflow_dispatch: # allows manual trigger from Actions tab

jobs:
  update-tip:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: pip install requests

      - name: 🤖 Fetch and inject daily DevOps tip
        run: python .github/scripts/update_tip.py

      - name: 💾 Commit and push updated README
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --staged --quiet || git commit -m "🤖 Auto-update: Daily DevOps Tip [$(date +'%Y-%m-%d')]"
          git push
